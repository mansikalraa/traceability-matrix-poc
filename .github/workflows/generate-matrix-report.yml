name: Generate Traceability Matrix Report

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode (1: Summary & Audit, 2: Full Report)'
        required: true
        default: '2'
        type: choice
        options:
          - '2'
          - '1'
      format:
        description: 'Output Document Format'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'docx'
          - 'pdf'

jobs:
  generate-report:
    name: Generate Matrix & Compliance Report
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read
      pull-requests: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-docx reportlab

      - name: Run Traceability Report Generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python generate_matrix_report.py --mode ${{ github.event.inputs.mode }} --format ${{ github.event.inputs.format }} --output traceability_report

      - name: Upload Generated Documents as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: traceability-compliance-report-mode-${{ github.event.inputs.mode }}
          path: |
            *.docx
            *.pdf
          if-no-files-found: error
